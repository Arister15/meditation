<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZEN</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZEN">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0c'/%3E%3Ccircle cx='256' cy='256' r='140' stroke='%23d4a373' stroke-width='16' fill='none'/%3E%3Ccircle cx='256' cy='256' r='20' fill='%23d4a373'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #141418;
      --card-border: rgba(255, 255, 255, 0.07);
      --accent: #d4a373;
      --accent-dim: rgba(212, 163, 115, 0.15);
      --text-main: #f4f4f5;
      --text-muted: #8b8b94;
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.15);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
    }

    body {
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 0 0 0;
    }

    .app-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.8rem 1.4rem calc(env(safe-area-inset-bottom, 12px) + 0.4rem);
      height: 100%;
      overflow: hidden;
    }

    header {
      padding: 0.8rem 0 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.15rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.95;
    }

    .btn-header-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-header-action:active {
      transform: scale(0.92);
      background: var(--accent-dim);
    }

    /* Anchored Upper Stage with comfortable spacing */
    .top-interactive-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 410px;
      justify-content: space-between;
      margin-top: 0.8rem;
      margin-bottom: 1.2rem;
      flex-shrink: 0;
    }

    /* Mode Switcher */
    .mode-nav {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 4px;
      width: 100%;
      max-width: 290px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0a0a0c;
      font-weight: 600;
    }

    /* Central Dial */
    .circle-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
    }

    .progress-ring-bg {
      stroke: var(--card-border);
      stroke-width: 4;
      fill: transparent;
    }

    .progress-ring-circle {
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 660;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.25s linear;
    }

    .timer-text-wrap {
      text-align: center;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time-digits {
      font-size: 3.6rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Stepper */
    .presets-container {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .time-stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .time-stepper.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .stepper-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .stepper-btn:active {
      background: var(--accent-dim);
      color: var(--accent);
      transform: scale(0.92);
    }

    .stepper-label {
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--accent);
      min-width: 54px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls-container {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .btn-action {
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(212, 163, 115, 0.25);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-action:active {
      transform: scale(0.94);
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-secondary:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .btn-secondary.hidden-slot {
      visibility: hidden;
      pointer-events: none;
    }

    /* Dashboard Metrics */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.2rem;
      flex-shrink: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.05rem 1.15rem;
      position: relative;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:active {
      background: rgba(255, 255, 255, 0.03);
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-label-hint {
      font-size: 0.65rem;
      color: var(--accent);
      text-transform: none;
      letter-spacing: 0;
    }

    .card-val {
      font-size: 1.68rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .card-unit {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* History section */
    .history-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .section-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      flex-shrink: 0;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 11px 15px;
      border-radius: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .history-date {
      color: var(--text-muted);
    }

    .history-avg {
      font-weight: 500;
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 1rem 0;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #18181d;
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 1.4rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom, 20px));
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .input-field {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 13px;
      font-size: 1.05rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .modal-btn-submit {
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
      transition: opacity 0.2s;
    }

    .modal-btn-submit:active {
      opacity: 0.85;
    }

    .session-items-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0.4rem;
      max-height: 52vh;
    }

    .session-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item-mins {
      font-weight: 500;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .session-item-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-delete-session {
      background: var(--danger-dim);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header>
      <div class="app-title">ZEN</div>
      <button class="btn-header-action" onclick="openManualEntryModal()" title="Manual Log">+</button>
    </header>

    <div class="top-interactive-stage">
      <nav class="mode-nav">
        <button class="mode-btn active" id="btnModeStopwatch" onclick="switchMode('stopwatch')">Stopwatch</button>
        <button class="mode-btn" id="btnModeTimer" onclick="switchMode('timer')">Timer</button>
      </nav>

      <div class="circle-wrapper">
        <svg class="progress-ring" width="220" height="220">
          <circle class="progress-ring-bg" cx="110" cy="110" r="105" />
          <circle class="progress-ring-circle" id="progressRing" cx="110" cy="110" r="105" />
        </svg>
        <div class="timer-text-wrap">
          <div class="time-digits" id="timeDisplay">00:00</div>
        </div>
      </div>

      <div class="presets-container">
        <div class="time-stepper hidden" id="stepperRow">
          <button class="stepper-btn" onclick="adjustTimerDuration(-5)">-5 min</button>
          <button class="stepper-btn" onclick="adjustTimerDuration(-1)">-1 min</button>
          <span class="stepper-label" id="stepperDurationLabel">10 min</span>
          <button class="stepper-btn" onclick="adjustTimerDuration(1)">+1 min</button>
          <button class="stepper-btn" onclick="adjustTimerDuration(5)">+5 min</button>
        </div>
      </div>

      <div class="controls-container">
        <div class="controls">
          <button class="btn-secondary" id="btnReset" onclick="resetCurrentSession()" title="Reset" disabled>✕</button>
          <button class="btn-action" id="btnToggle" onclick="toggleSession()">▶</button>
          <button class="btn-secondary" id="btnSave" onclick="manualSaveStopwatch()" title="Finish" disabled>✓</button>
        </div>
      </div>
    </div>

    <div class="dashboard">
      <div class="card clickable" onclick="openManageSessionsModal()" title="View today's sessions">
        <div class="card-label">
          <span>Today</span>
          <span class="card-label-hint">View ↗</span>
        </div>
        <div class="card-val"><span id="metricToday">0.0</span><span class="card-unit">min</span></div>
      </div>
      <div class="card">
        <div class="card-label">Current Week</div>
        <div class="card-val"><span id="metricWeekAvg">0.0</span><span class="card-unit">min/day</span></div>
      </div>
    </div>

    <div class="history-section">
      <div class="section-title">Weekly History (Daily Avg)</div>
      <div class="history-list" id="historyList">
        <div class="empty-state">No completed weeks yet</div>
      </div>
    </div>
  </div>

  <!-- Modal 1: Manual Session Entry -->
  <div class="modal-backdrop" id="modalManualEntry" onclick="onBackdropClick(event, 'modalManualEntry')">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Log Session</div>
        <button class="modal-close" onclick="closeModal('modalManualEntry')">×</button>
      </div>
      <div class="modal-form">
        <div class="input-group">
          <label class="input-label">Duration (Minutes)</label>
          <input type="number" step="0.5" min="0.5" id="manualMinutesInput" class="input-field" placeholder="e.g. 15 or 10.5" inputmode="decimal">
        </div>
        <div class="input-group">
          <label class="input-label">Date</label>
          <input type="date" id="manualDateInput" class="input-field">
        </div>
        <button class="modal-btn-submit" onclick="submitManualEntry()">Save Session</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: View & Delete Today's Sessions -->
  <div class="modal-backdrop" id="modalManageSessions" onclick="onBackdropClick(event, 'modalManageSessions')">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Today's Sessions</div>
        <button class="modal-close" onclick="closeModal('modalManageSessions')">×</button>
      </div>
      <div class="session-items-scroll" id="sessionItemsContainer"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'zen_meditation_sessions_v1';
    const TIMER_PREF_KEY = 'zen_meditation_last_timer_sec';

    let currentMode = 'stopwatch';
    let isRunning = false;
    
    // Remember last used timer duration, defaulting to 10 minutes
    let savedDuration = parseInt(localStorage.getItem(TIMER_PREF_KEY), 10);
    let timerDurationSeconds = (!isNaN(savedDuration) && savedDuration >= 60) ? savedDuration : (10 * 60);

    let elapsedSeconds = 0;
    let intervalId = null;
    let wakeLock = null;

    const ringRadius = 105;
    const ringCircumference = 2 * Math.PI * ringRadius;

    const timeDisplay = document.getElementById('timeDisplay');
    const progressRing = document.getElementById('progressRing');
    const btnToggle = document.getElementById('btnToggle');
    const btnReset = document.getElementById('btnReset');
    const btnSave = document.getElementById('btnSave');
    const stepperRow = document.getElementById('stepperRow');
    const stepperDurationLabel = document.getElementById('stepperDurationLabel');
    const metricToday = document.getElementById('metricToday');
    const metricWeekAvg = document.getElementById('metricWeekAvg');
    const historyList = document.getElementById('historyList');

    progressRing.style.strokeDasharray = `${ringCircumference} ${ringCircumference}`;
    progressRing.style.strokeDashoffset = '0';

    /* Audio Synthesizers */
    function playIPhoneTimerChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const notes = [1046.50, 1318.51, 1567.98, 2093.00];
        
        notes.forEach((freq, idx) => {
          const startTime = ctx.currentTime + (idx * 0.14);
          const duration = 0.45;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(0.7, startTime + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + duration);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function playZenBell() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(108, ctx.currentTime + 3.0);

        gain.gain.setValueAtTime(0.6, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 3.0);
      } catch (e) {
        console.error(e);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function getTodayDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMondayOfWeek(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      date.setDate(diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function formatShortDate(d) {
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function getSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveSessionRecord(minutes, dateStr = null) {
      if (minutes <= 0) return;
      const sessions = getSessions();
      sessions.push({
        id: Date.now() + Math.random(),
        date: dateStr || getTodayDateString(),
        timeStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        minutes: Number(minutes)
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      renderDashboard();
    }

    function deleteSession(id) {
      let sessions = getSessions();
      sessions = sessions.filter(s => s.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      renderDashboard();
      renderTodaySessionsList();
    }

    function roundStopwatchMinutes(seconds) {
      return Math.floor(seconds / 30) * 0.5;
    }

    function calculateDailyAverageTruncated(totalMinutes) {
      return Math.floor((totalMinutes / 7) * 10) / 10;
    }

    function switchMode(mode) {
      if (isRunning) resetCurrentSession();
      currentMode = mode;
      
      document.getElementById('btnModeStopwatch').classList.toggle('active', mode === 'stopwatch');
      document.getElementById('btnModeTimer').classList.toggle('active', mode === 'timer');

      if (mode === 'timer') {
        stepperRow.classList.remove('hidden');
        btnSave.classList.add('hidden-slot');
        stepperDurationLabel.textContent = `${Math.round(timerDurationSeconds / 60)} min`;
      } else {
        stepperRow.classList.add('hidden');
        btnSave.classList.remove('hidden-slot');
      }

      updateDisplay();
    }

    function adjustTimerDuration(deltaMinutes) {
      if (isRunning) resetCurrentSession();
      let currentMins = Math.round(timerDurationSeconds / 60);
      let updatedMins = currentMins + deltaMinutes;
      if (updatedMins < 1) updatedMins = 1;
      if (updatedMins > 180) updatedMins = 180;

      timerDurationSeconds = updatedMins * 60;
      localStorage.setItem(TIMER_PREF_KEY, timerDurationSeconds.toString());
      stepperDurationLabel.textContent = `${updatedMins} min`;
      updateDisplay();
    }

    function toggleSession() {
      if (isRunning) {
        pauseSession();
      } else {
        startSession();
      }
    }

    function startSession() {
      isRunning = true;
      btnToggle.textContent = '❚❚';
      btnReset.disabled = false;
      btnSave.disabled = false;
      requestWakeLock();

      intervalId = setInterval(() => {
        if (currentMode === 'stopwatch') {
          elapsedSeconds++;
          updateDisplay();
        } else {
          elapsedSeconds++;
          updateDisplay();
          if (elapsedSeconds >= timerDurationSeconds) {
            finishTimer();
          }
        }
      }, 1000);
    }

    function pauseSession() {
      isRunning = false;
      btnToggle.textContent = '▶';
      clearInterval(intervalId);
      releaseWakeLock();
    }

    function resetCurrentSession() {
      pauseSession();
      elapsedSeconds = 0;
      btnReset.disabled = true;
      btnSave.disabled = true;
      updateDisplay();
    }

    function manualSaveStopwatch() {
      const minutesToRecord = roundStopwatchMinutes(elapsedSeconds);
      if (minutesToRecord > 0) {
        playZenBell();
        saveSessionRecord(minutesToRecord);
      }
      resetCurrentSession();
    }

    function finishTimer() {
      pauseSession();
      playIPhoneTimerChime();
      const mins = timerDurationSeconds / 60;
      saveSessionRecord(mins);
      resetCurrentSession();
    }

    function updateDisplay() {
      if (currentMode === 'stopwatch') {
        const m = Math.floor(elapsedSeconds / 60);
        const s = elapsedSeconds % 60;
        timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        const circleProgress = (elapsedSeconds % 60) / 60;
        progressRing.style.strokeDashoffset = ringCircumference * (1 - circleProgress);
      } else {
        const remaining = Math.max(0, timerDurationSeconds - elapsedSeconds);
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        const progress = elapsedSeconds / timerDurationSeconds;
        progressRing.style.strokeDashoffset = ringCircumference * (1 - progress);
      }
    }

    function renderDashboard() {
      const sessions = getSessions();
      const todayStr = getTodayDateString();
      const now = new Date();
      const currentMonday = getMondayOfWeek(now);
      const currentMondayStr = getTodayDateString(currentMonday);

      const todaySum = sessions
        .filter(s => s.date === todayStr)
        .reduce((acc, cur) => acc + cur.minutes, 0);
      metricToday.textContent = todaySum.toFixed(1);

      const currentWeekSunday = new Date(currentMonday);
      currentWeekSunday.setDate(currentWeekSunday.getDate() + 6);
      const currentSundayStr = getTodayDateString(currentWeekSunday);

      const currentWeekSum = sessions
        .filter(s => s.date >= currentMondayStr && s.date <= currentSundayStr)
        .reduce((acc, cur) => acc + cur.minutes, 0);

      const currentWeekAvg = calculateDailyAverageTruncated(currentWeekSum);
      metricWeekAvg.textContent = currentWeekAvg.toFixed(1);

      const pastWeeksMap = {};

      sessions.forEach(s => {
        const sDate = new Date(s.date + 'T00:00:00');
        const sMonday = getMondayOfWeek(sDate);
        const sMondayStr = getTodayDateString(sMonday);

        if (sMonday < currentMonday) {
          if (!pastWeeksMap[sMondayStr]) {
            pastWeeksMap[sMondayStr] = {
              monday: sMonday,
              totalMinutes: 0
            };
          }
          pastWeeksMap[sMondayStr].totalMinutes += s.minutes;
        }
      });

      const sortedWeeks = Object.values(pastWeeksMap).sort((a, b) => b.monday - a.monday);

      if (sortedWeeks.length === 0) {
        historyList.innerHTML = `<div class="empty-state">No completed weeks yet</div>`;
      } else {
        historyList.innerHTML = sortedWeeks.map(item => {
          const sun = new Date(item.monday);
          sun.setDate(sun.getDate() + 6);
          const avg = calculateDailyAverageTruncated(item.totalMinutes);
          return `
            <div class="history-row">
              <span class="history-date">${formatShortDate(item.monday)} - ${formatShortDate(sun)}</span>
              <span class="history-avg">${avg.toFixed(1)} min/day</span>
            </div>
          `;
        }).join('');
      }
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function onBackdropClick(event, id) {
      if (event.target.id === id) {
        closeModal(id);
      }
    }

    function openManualEntryModal() {
      document.getElementById('manualDateInput').value = getTodayDateString();
      document.getElementById('manualMinutesInput').value = '';
      openModal('modalManualEntry');
      setTimeout(() => document.getElementById('manualMinutesInput').focus(), 150);
    }

    function submitManualEntry() {
      const val = parseFloat(document.getElementById('manualMinutesInput').value);
      const dateVal = document.getElementById('manualDateInput').value;
      if (val && val > 0) {
        saveSessionRecord(val, dateVal || getTodayDateString());
        closeModal('modalManualEntry');
      }
    }

    function openManageSessionsModal() {
      renderTodaySessionsList();
      openModal('modalManageSessions');
    }

    function renderTodaySessionsList() {
      const container = document.getElementById('sessionItemsContainer');
      const sessions = getSessions();
      const todayStr = getTodayDateString();
      const todaySessions = sessions.filter(s => s.date === todayStr).reverse();

      if (todaySessions.length === 0) {
        container.innerHTML = `<div class="empty-state">No recorded sessions for today yet.</div>`;
        return;
      }

      container.innerHTML = todaySessions.map(s => `
        <div class="session-item">
          <div class="session-item-info">
            <span class="session-item-mins">${s.minutes.toFixed(1)} min</span>
            <span class="session-item-time">${s.timeStr ? 'Time: ' + s.timeStr : 'Manual log'}</span>
          </div>
          <button class="btn-delete-session" onclick="deleteSession(${s.id})" title="Delete">✕</button>
        </div>
      `).join('');
    }

    /* Stable Service Worker Registration without reload loops */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            reg.update();
          })
          .catch((err) => console.error('SW Error:', err));
      });
    }

    // Initialize UI
    stepperDurationLabel.textContent = `${Math.round(timerDurationSeconds / 60)} min`;
    switchMode('stopwatch');
    renderDashboard();
  </script>
</body>
</html>
