<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZEN</title>

  <!-- Self-Contained Inline PWA Manifest (100% Offline Ready) -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22ZEN%22%2C%22short_name%22%3A%22ZEN%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a0c%22%2C%22theme_color%22%3A%22%230a0a0c%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%25200%2520512%2520512%27%253E%253Crect%2520width%3D%27512%27%2520height%3D%27512%27%2520fill%3D%27%25230a0a0c%27%2F%253E%253Ccircle%2520cx%3D%27256%27%2520cy%3D%27256%27%2520r%3D%27140%27%2520stroke%3D%27%2523d4a373%27%2520stroke-width%3D%2716%27%2520fill%3D%27none%27%2F%253E%253Ccircle%2520cx%3D%27256%27%2520cy%3D%27256%27%2520r%3D%2720%27%2520fill%3D%27%2523d4a373%27%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZEN">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0c'/%3E%3Ccircle cx='256' cy='256' r='140' stroke='%23d4a373' stroke-width='16' fill='none'/%3E%3Ccircle cx='256' cy='256' r='20' fill='%23d4a373'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: rgba(20, 20, 25, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-highlight: rgba(255, 255, 255, 0.14);
      --accent: #d4a373;
      --accent-dim: rgba(212, 163, 115, 0.16);
      --accent-glow: rgba(212, 163, 115, 0.28);
      --text-main: #f4f4f5;
      --text-muted: #8e8e98;
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.16);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 18%, rgba(212, 163, 115, 0.07) 0%, transparent 65%);
    }

    body {
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 0 0 0;
    }

    .app-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.8rem 1.4rem calc(env(safe-area-inset-bottom, 14px) + 0.8rem);
      height: 100%;
      overflow: hidden;
    }

    header {
      padding: 0.6rem 0 0.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.15rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.95;
    }

    .btn-header-action {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .btn-header-action:active {
      transform: scale(0.92);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* Centered Stopwatch Stage */
    .top-interactive-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin: auto 0;
      flex-shrink: 0;
    }

    /* Central Dial */
    .circle-wrapper {
      position: relative;
      width: 224px;
      height: 224px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
    }

    .progress-ring-bg {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 4;
      fill: transparent;
    }

    .progress-ring-circle {
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 672.3;
      stroke-dashoffset: 672.3;
      transition: stroke-dashoffset 0.2s linear;
    }

    .timer-text-wrap {
      text-align: center;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time-digits {
      font-size: 3.65rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Controls */
    .controls-container {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .controls {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
    }

    .btn-action {
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
    }

    .btn-action:active {
      transform: scale(0.92);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      color: var(--text-main);
      border-color: var(--card-border-highlight);
    }

    .btn-secondary:active:not(:disabled) {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }

    /* Bottom Metrics & History Trigger */
    .bottom-section {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.1rem 1.2rem;
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      transition: border-color 0.2s, background-color 0.2s, transform 0.15s ease;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:active {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--card-border-highlight);
      transform: scale(0.985);
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-label-hint {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      color: var(--accent);
      text-transform: none;
      letter-spacing: 0;
    }

    .card-val {
      font-size: 1.7rem;
      font-weight: 500;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .card-unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* History Action Button */
    .btn-history-trigger {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-history-trigger:hover {
      border-color: var(--card-border-highlight);
    }

    .btn-history-trigger:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(212, 163, 115, 0.35);
    }

    .history-btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-btn-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--accent-dim);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .history-btn-text {
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-main);
    }

    .history-btn-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-count-badge {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .history-chevron {
      color: var(--accent);
      display: flex;
      align-items: center;
    }

    /* History Modal List */
    .history-items-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0.2rem;
      max-height: 58vh;
    }

    .history-row {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 13px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .history-row.latest-week {
      border-color: rgba(212, 163, 115, 0.25);
      background: linear-gradient(90deg, rgba(212, 163, 115, 0.07) 0%, rgba(20, 20, 25, 0.65) 100%);
    }

    .history-date-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-date {
      color: var(--text-main);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .history-latest-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    .history-avg {
      font-weight: 500;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding: 1.6rem 0;
    }

    /* Modals & Bottom Sheets */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: rgba(22, 22, 28, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border-highlight);
      border-bottom: none;
      border-radius: 26px 26px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 0.75rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom, 20px));
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-drag-handle {
      width: 38px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 0.9rem;
      flex-shrink: 0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      flex-shrink: 0;
    }

    .modal-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-title {
      font-size: 1.12rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .modal-subtitle {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .modal-close:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding-left: 2px;
    }

    .input-field {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1.05rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.18);
    }

    .modal-btn-submit {
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.4rem;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .modal-btn-submit:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .session-items-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0.2rem;
      max-height: 52vh;
    }

    .session-item {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item-mins {
      font-weight: 500;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .session-item-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-delete-session {
      background: var(--danger-dim);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .btn-delete-session:active {
      transform: scale(0.9);
      background: rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header>
      <div class="app-title">ZEN</div>
      <button class="btn-header-action" onclick="openManualEntryModal()" title="Manual Log" aria-label="Manual Log">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <div class="top-interactive-stage">
      <div class="circle-wrapper">
        <svg class="progress-ring" width="224" height="224">
          <circle class="progress-ring-bg" cx="112" cy="112" r="107" />
          <circle class="progress-ring-circle" id="progressRing" cx="112" cy="112" r="107" />
        </svg>
        <div class="timer-text-wrap">
          <div class="time-digits" id="timeDisplay">00:00</div>
        </div>
      </div>

      <div class="controls-container">
        <div class="controls">
          <button class="btn-secondary" id="btnReset" onclick="resetCurrentSession()" title="Reset" aria-label="Reset" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <button class="btn-action" id="btnToggle" onclick="toggleSession()" title="Start / Pause" aria-label="Start">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="transform: translateX(1.5px);">
              <polygon points="6 4 20 12 6 20"></polygon>
            </svg>
          </button>
          <button class="btn-secondary" id="btnSave" onclick="manualSaveStopwatch()" title="Finish" aria-label="Save" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="dashboard">
        <div class="card clickable" onclick="openManageSessionsModal()" title="View today's sessions">
          <div class="card-label">
            <span>Today</span>
            <span class="card-label-hint">
              View
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </div>
          <div class="card-val"><span id="metricToday">0.0</span><span class="card-unit">min</span></div>
        </div>
        <div class="card">
          <div class="card-label">Current Week</div>
          <div class="card-val"><span id="metricWeekAvg">0.0</span><span class="card-unit">min/day</span></div>
        </div>
      </div>

      <button class="btn-history-trigger" onclick="openHistoryModal()" aria-label="History">
        <div class="history-btn-left">
          <div class="history-btn-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 7 12 12 15.5 14"></polyline>
            </svg>
          </div>
          <span class="history-btn-text">History</span>
        </div>
        <div class="history-btn-right">
          <span class="history-count-badge" id="historyCountBadge"></span>
          <span class="history-chevron">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>
        </div>
      </button>
    </div>
  </div>

  <!-- Modal 1: Manual Session Entry -->
  <div class="modal-backdrop" id="modalManualEntry" onclick="onBackdropClick(event, 'modalManualEntry')">
    <div class="modal-sheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <div class="modal-title">Log Session</div>
        <button class="modal-close" onclick="closeModal('modalManualEntry')" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form class="modal-form" onsubmit="event.preventDefault(); submitManualEntry();">
        <div class="input-group">
          <label class="input-label" for="manualMinutesInput">Duration (Minutes)</label>
          <input 
            type="text" 
            inputmode="decimal" 
            lang="en"
            id="manualMinutesInput" 
            class="input-field" 
            placeholder="e.g. 15 or 2.5" 
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          >
        </div>
        <div class="input-group">
          <label class="input-label" for="manualDateInput">Date</label>
          <input type="date" id="manualDateInput" class="input-field">
        </div>
        <button type="submit" class="modal-btn-submit">Save Session</button>
      </form>
    </div>
  </div>

  <!-- Modal 2: View & Delete Today's Sessions -->
  <div class="modal-backdrop" id="modalManageSessions" onclick="onBackdropClick(event, 'modalManageSessions')">
    <div class="modal-sheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <div class="modal-title">Today's Sessions</div>
        <button class="modal-close" onclick="closeModal('modalManageSessions')" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="session-items-scroll" id="sessionItemsContainer"></div>
    </div>
  </div>

  <!-- Modal 3: Weekly History (Daily Avg) -->
  <div class="modal-backdrop" id="modalHistory" onclick="onBackdropClick(event, 'modalHistory')">
    <div class="modal-sheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-title">History</div>
          <div class="modal-subtitle">Weekly Daily Average</div>
        </div>
        <button class="modal-close" onclick="closeModal('modalHistory')" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="history-items-scroll" id="historyList">
        <div class="empty-state">No completed weeks yet</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'zen_meditation_sessions_v1';

    const ICON_PLAY = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="transform: translateX(1.5px);"><polygon points="6 4 20 12 6 20"></polygon></svg>`;
    const ICON_PAUSE = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="4" width="3.8" height="16" rx="1.5"></rect><rect x="14.2" y="4" width="3.8" height="16" rx="1.5"></rect></svg>`;

    let isRunning = false;
    let elapsedSeconds = 0;
    let timerStartTimestamp = 0;
    let baseElapsedAtStart = 0;
    let intervalId = null;
    let wakeLock = null;
    let audioCtx = null;

    const ringRadius = 107;
    const ringCircumference = 2 * Math.PI * ringRadius;

    const timeDisplay = document.getElementById('timeDisplay');
    const progressRing = document.getElementById('progressRing');
    const btnToggle = document.getElementById('btnToggle');
    const btnReset = document.getElementById('btnReset');
    const btnSave = document.getElementById('btnSave');
    const metricToday = document.getElementById('metricToday');
    const metricWeekAvg = document.getElementById('metricWeekAvg');
    const historyList = document.getElementById('historyList');
    const historyCountBadge = document.getElementById('historyCountBadge');

    progressRing.style.strokeDasharray = `${ringCircumference} ${ringCircumference}`;
    progressRing.style.strokeDashoffset = `${ringCircumference}`;

    /* Offline-Ready Audio Context Setup */
    function getAudioContext() {
      try {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtxClass) return null;
        if (!audioCtx) {
          audioCtx = new AudioCtxClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playZenBell() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(108, ctx.currentTime + 3.0);

        gain.gain.setValueAtTime(0.6, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 3.0);
      } catch (e) {
        console.error(e);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isRunning) {
        requestWakeLock();
      }
    });

    function getTodayDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      const parts = dateStr.split('-');
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function getMondayOfWeek(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      date.setDate(diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    /* Day/Month format (Μέρα/Μήνας) */
    function formatShortDate(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}/${month}`;
    }

    function getSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveSessionRecord(minutes, dateStr = null) {
      const cleanMins = Number(minutes);
      if (isNaN(cleanMins) || cleanMins <= 0) return;
      const sessions = getSessions();
      sessions.push({
        id: Date.now() + Math.random(),
        date: dateStr || getTodayDateString(),
        timeStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        minutes: cleanMins
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      renderDashboard();
    }

    function deleteSession(id) {
      let sessions = getSessions();
      sessions = sessions.filter(s => s.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      renderDashboard();
      renderTodaySessionsList();
    }

    function roundStopwatchMinutes(seconds) {
      return Math.floor(seconds / 30) * 0.5;
    }

    function calculateDailyAverageTruncated(totalMinutes) {
      return Math.floor((totalMinutes / 7) * 10) / 10;
    }

    function toggleSession() {
      getAudioContext();
      if (isRunning) {
        pauseSession();
      } else {
        startSession();
      }
    }

    function startSession() {
      isRunning = true;
      btnToggle.innerHTML = ICON_PAUSE;
      btnReset.disabled = false;
      btnSave.disabled = false;
      requestWakeLock();

      timerStartTimestamp = performance.now();
      baseElapsedAtStart = elapsedSeconds;

      clearInterval(intervalId);
      intervalId = setInterval(() => {
        const deltaSeconds = Math.floor((performance.now() - timerStartTimestamp) / 1000);
        elapsedSeconds = baseElapsedAtStart + deltaSeconds;
        updateDisplay();
      }, 250);
    }

    function pauseSession() {
      isRunning = false;
      btnToggle.innerHTML = ICON_PLAY;
      clearInterval(intervalId);
      releaseWakeLock();
    }

    function resetCurrentSession() {
      pauseSession();
      elapsedSeconds = 0;
      baseElapsedAtStart = 0;
      btnReset.disabled = true;
      btnSave.disabled = true;
      updateDisplay();
    }

    function manualSaveStopwatch() {
      const minutesToRecord = roundStopwatchMinutes(elapsedSeconds);
      if (minutesToRecord > 0) {
        playZenBell();
        saveSessionRecord(minutesToRecord);
      }
      resetCurrentSession();
    }

    function updateDisplay() {
      const m = Math.floor(elapsedSeconds / 60);
      const s = elapsedSeconds % 60;
      timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const circleProgress = (elapsedSeconds % 60) / 60;
      progressRing.style.strokeDashoffset = ringCircumference * (1 - circleProgress);
    }

    function renderDashboard() {
      const sessions = getSessions();
      const todayStr = getTodayDateString();
      const now = new Date();
      const currentMonday = getMondayOfWeek(now);
      const currentMondayStr = getTodayDateString(currentMonday);

      const todaySum = sessions
        .filter(s => s.date === todayStr)
        .reduce((acc, cur) => acc + cur.minutes, 0);
      metricToday.textContent = todaySum.toFixed(1);

      const currentWeekSunday = new Date(currentMonday);
      currentWeekSunday.setDate(currentWeekSunday.getDate() + 6);
      const currentSundayStr = getTodayDateString(currentWeekSunday);

      const currentWeekSum = sessions
        .filter(s => s.date >= currentMondayStr && s.date <= currentSundayStr)
        .reduce((acc, cur) => acc + cur.minutes, 0);

      const currentWeekAvg = calculateDailyAverageTruncated(currentWeekSum);
      metricWeekAvg.textContent = currentWeekAvg.toFixed(1);

      const pastWeeksMap = {};

      sessions.forEach(s => {
        const sDate = parseLocalDate(s.date);
        const sMonday = getMondayOfWeek(sDate);
        const sMondayStr = getTodayDateString(sMonday);

        if (sMonday < currentMonday) {
          if (!pastWeeksMap[sMondayStr]) {
            pastWeeksMap[sMondayStr] = {
              monday: sMonday,
              totalMinutes: 0
            };
          }
          pastWeeksMap[sMondayStr].totalMinutes += s.minutes;
        }
      });

      /* Sort newest week first (top of list) */
      const sortedWeeks = Object.values(pastWeeksMap).sort((a, b) => b.monday - a.monday);

      if (sortedWeeks.length === 0) {
        historyCountBadge.textContent = '';
        historyList.innerHTML = `<div class="empty-state">No completed weeks yet</div>`;
      } else {
        historyCountBadge.textContent = `${sortedWeeks.length} ${sortedWeeks.length === 1 ? 'week' : 'weeks'}`;
        historyList.innerHTML = sortedWeeks.map((item, idx) => {
          const sun = new Date(item.monday);
          sun.setDate(sun.getDate() + 6);
          const avg = calculateDailyAverageTruncated(item.totalMinutes);
          const isLatest = idx === 0;
          return `
            <div class="history-row ${isLatest ? 'latest-week' : ''}">
              <div class="history-date-wrap">
                <span class="history-date">${formatShortDate(item.monday)} - ${formatShortDate(sun)}</span>
                ${isLatest ? '<span class="history-latest-tag">Latest</span>' : ''}
              </div>
              <span class="history-avg">${avg.toFixed(1)} min/day</span>
            </div>
          `;
        }).join('');
      }
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function onBackdropClick(event, id) {
      if (event.target.id === id) {
        closeModal(id);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal('modalManualEntry');
        closeModal('modalManageSessions');
        closeModal('modalHistory');
      }
    });

    const manualMinutesInput = document.getElementById('manualMinutesInput');

    manualMinutesInput.addEventListener('input', (e) => {
      if (e.target.value.includes(',')) {
        e.target.value = e.target.value.replace(',', '.');
      }
    });

    function openManualEntryModal() {
      document.getElementById('manualDateInput').value = getTodayDateString();
      manualMinutesInput.value = '';
      openModal('modalManualEntry');
      setTimeout(() => manualMinutesInput.focus(), 150);
    }

    function submitManualEntry() {
      const rawText = manualMinutesInput.value.trim().replace(',', '.');
      const val = parseFloat(rawText);
      const dateVal = document.getElementById('manualDateInput').value;

      if (!isNaN(val) && val > 0 && isFinite(val)) {
        saveSessionRecord(Number(val.toFixed(2)), dateVal || getTodayDateString());
        closeModal('modalManualEntry');
      } else {
        manualMinutesInput.style.borderColor = 'var(--danger)';
        setTimeout(() => {
          manualMinutesInput.style.borderColor = '';
        }, 1200);
      }
    }

    function openManageSessionsModal() {
      renderTodaySessionsList();
      openModal('modalManageSessions');
    }

    function openHistoryModal() {
      renderDashboard();
      openModal('modalHistory');
    }

    function renderTodaySessionsList() {
      const container = document.getElementById('sessionItemsContainer');
      const sessions = getSessions();
      const todayStr = getTodayDateString();
      const todaySessions = sessions.filter(s => s.date === todayStr).reverse();

      if (todaySessions.length === 0) {
        container.innerHTML = `<div class="empty-state">No recorded sessions for today yet.</div>`;
        return;
      }

      container.innerHTML = todaySessions.map(s => `
        <div class="session-item">
          <div class="session-item-info">
            <span class="session-item-mins">${s.minutes.toFixed(1)} min</span>
            <span class="session-item-time">${s.timeStr ? 'Time: ' + s.timeStr : 'Manual log'}</span>
          </div>
          <button class="btn-delete-session" onclick="deleteSession(${s.id})" title="Delete" aria-label="Delete session">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      `).join('');
    }

    /* Offline Cache & Optional Service Worker Setup */
    window.addEventListener('load', () => {
      if ('caches' in window && (location.protocol === 'http:' || location.protocol === 'https:')) {
        caches.open('zen-offline-v1')
          .then(cache => cache.add(window.location.href))
          .catch(() => {});
      }

      if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
        fetch('./sw.js', { method: 'HEAD' })
          .then(res => {
            if (res.ok) {
              navigator.serviceWorker.register('./sw.js').then(reg => reg.update());
            }
          })
          .catch(() => {});
      }
    });

    // Initialize UI
    updateDisplay();
    renderDashboard();
  </script>
</body>
</html>
